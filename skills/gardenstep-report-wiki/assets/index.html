<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gardenstep Report Wiki</title>
  <style>
    :root {
      --paper:#f6f7f3; --surface:#fff; --ink:#173423; --text:#34483a;
      --muted:#718078; --line:#dbe2da; --green:#1e6833; --green-soft:#edf4ee;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--text); font-family:Inter,Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
    .wrap { width:min(1060px,calc(100% - 32px)); margin:0 auto; padding:52px 0 80px; }
    header { display:flex; justify-content:space-between; gap:32px; align-items:end; padding-bottom:28px; border-bottom:1px solid var(--line); }
    .eyebrow { margin:0 0 8px; color:var(--green); font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin:0; color:var(--ink); font-size:clamp(32px,6vw,56px); line-height:1.08; letter-spacing:-.045em; }
    .subtitle { max-width:470px; margin:0; color:var(--muted); font-size:14px; line-height:1.7; }
    .toolbar { display:grid; grid-template-columns:1fr 220px 160px; gap:10px; margin:28px 0 16px; }
    input,select { width:100%; min-height:44px; padding:10px 13px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); font:inherit; }
    input:focus,select:focus { outline:2px solid rgba(30,104,51,.18); border-color:var(--green); }
    .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px; }
    .chip { padding:7px 12px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--muted); cursor:pointer; font-size:12px; font-weight:700; }
    .chip.active { border-color:var(--green); background:var(--green); color:#fff; }
    .summary { display:flex; justify-content:space-between; gap:16px; margin:0 0 12px; color:var(--muted); font-size:12px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .card { display:flex; flex-direction:column; min-height:190px; padding:20px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
    .meta { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:15px; }
    .project { padding:4px 8px; border-radius:4px; background:var(--green-soft); color:var(--green); font-size:11px; font-weight:800; }
    .date { color:var(--muted); font:500 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .card h2 { margin:0 0 8px; color:var(--ink); font-size:18px; line-height:1.42; letter-spacing:-.02em; }
    .desc { margin:0; color:var(--muted); font-size:13px; line-height:1.65; }
    .tags { display:flex; flex-wrap:wrap; gap:5px; margin:14px 0 18px; }
    .tag { padding:3px 7px; border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:10px; }
    .open { align-self:flex-start; margin-top:auto; padding:8px 12px; border-radius:5px; background:var(--ink); color:#fff; text-decoration:none; font-size:12px; font-weight:800; }
    .open:hover { background:var(--green); }
    .empty { grid-column:1/-1; padding:80px 20px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:8px; }
    footer { margin-top:34px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    @media (max-width:760px) {
      .wrap { width:min(100% - 20px,1060px); padding-top:30px; }
      header { display:block; }
      .subtitle { margin-top:14px; }
      .toolbar { grid-template-columns:1fr; }
      .grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><p class="eyebrow">Public · DEV</p><h1>Report Wiki</h1></div>
      <p class="subtitle">프로젝트별 HTML 보고서의 공개 아카이브. 검색·프로젝트 필터·날짜·제목 정렬 지원.</p>
    </header>
    <div class="toolbar">
      <input id="query" type="search" placeholder="제목·설명·태그 검색" aria-label="보고서 검색">
      <select id="project" aria-label="프로젝트 필터"><option value="all">전체 프로젝트</option></select>
      <select id="sort" aria-label="정렬 방식">
        <option value="newest">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="title">제목순</option>
        <option value="project">프로젝트순</option>
      </select>
    </div>
    <div class="chips" id="chips" aria-label="빠른 프로젝트 필터"></div>
    <p class="summary"><span id="count">0개 보고서</span><span>HTML 원문 새 창 열기</span></p>
    <div class="grid" id="grid"></div>
    <footer>Gardenstep DEV · Public report archive · 개인정보·비밀값·내부 전용 자료 게시 금지</footer>
  </main>
  <script src="data.js"></script>
  <script>
    const reports = Array.isArray(window.REPORTS) ? window.REPORTS : [];
    const state = { query:'', project:'all', sort:'newest' };
    const $ = id => document.getElementById(id);
    const projectLabel = value => ({chorok:'가든스텝',atomerce:'아토머스',panvola:'판볼라','hermes-ops':'개인 Hermes'}[value] || value);

    function filtered() {
      const q = state.query.trim().toLocaleLowerCase('ko');
      const items = reports.filter(item => {
        if (state.project !== 'all' && item.project !== state.project) return false;
        if (!q) return true;
        return [item.title,item.desc,item.project,...(item.tags||[])].join(' ').toLocaleLowerCase('ko').includes(q);
      });
      const compare = {
        newest:(a,b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title,'ko'),
        oldest:(a,b) => a.date.localeCompare(b.date) || a.title.localeCompare(b.title,'ko'),
        title:(a,b) => a.title.localeCompare(b.title,'ko') || b.date.localeCompare(a.date),
        project:(a,b) => projectLabel(a.project).localeCompare(projectLabel(b.project),'ko') || b.date.localeCompare(a.date),
      }[state.sort];
      return items.sort(compare);
    }

    function node(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function render() {
      const grid = $('grid');
      const items = filtered();
      grid.replaceChildren();
      $('count').textContent = `${items.length}개 보고서`;
      if (!items.length) { grid.append(node('div','empty','조건에 맞는 보고서 없음')); return; }
      for (const item of items) {
        const card = node('article','card');
        const meta = node('div','meta');
        meta.append(node('span','project',projectLabel(item.project)), node('span','date',item.date));
        card.append(meta, node('h2','',item.title), node('p','desc',item.desc || '설명 없음'));
        const tags = node('div','tags');
        for (const value of item.tags || []) tags.append(node('span','tag',value));
        card.append(tags);
        const link = node('a','open','보고서 열기');
        link.href = item.path;
        link.target = '_blank';
        link.rel = 'noopener';
        card.append(link);
        grid.append(card);
      }
    }

    function setProject(value) {
      state.project = value;
      $('project').value = value;
      for (const chip of document.querySelectorAll('.chip')) chip.classList.toggle('active', chip.dataset.project === value);
      render();
    }

    const projects = [...new Set(reports.map(item => item.project))].sort((a,b)=>projectLabel(a).localeCompare(projectLabel(b),'ko'));
    for (const value of projects) {
      const option = node('option','',projectLabel(value)); option.value = value; $('project').append(option);
    }
    for (const value of ['all',...projects]) {
      const label = value === 'all' ? '전체' : projectLabel(value);
      const count = value === 'all' ? reports.length : reports.filter(item => item.project === value).length;
      const chip = node('button','chip',`${label} ${count}`); chip.type='button'; chip.dataset.project=value;
      chip.addEventListener('click',()=>setProject(value)); $('chips').append(chip);
    }
    $('query').addEventListener('input',event=>{ state.query=event.target.value; render(); });
    $('project').addEventListener('change',event=>setProject(event.target.value));
    $('sort').addEventListener('change',event=>{ state.sort=event.target.value; render(); });
    setProject('all');
  </script>
</body>
</html>
